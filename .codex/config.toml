Preserve project do-not-touch constraints across all selected workstreams. Prefer the smallest team that can produce a high-quality verified result; multi-agent overhead without material contribution is a failure. Finish with the evidence-based completion vocabulary defined by Ercan OS: VERIFIED, PARTIAL, BLOCKED, or NOT VERIFIED.
