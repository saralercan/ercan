name: Full Alias Domain Review QA

on:
  pull_request:
    paths:
      - 'supabase/vinterro-first-touch-domain-review-complete-20261009.sql'
      - 'tests/test_vinterro_domain_alias_complete.py'
      - '.github/workflows/vinterro-domain-alias-complete.yml'
  push:
    branches: [master]
    paths:
      - 'supabase/vinterro-first-touch-domain-review-complete-20261009.sql'
      - 'tests/test_vinterro_domain_alias_complete.py'
      - '.github/workflows/vinterro-domain-alias-complete.yml'

permissions:
  contents: read

jobs:
  sql-policy-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Full alias history suppression static QA
        run: python3 -m unittest discover -s tests -p 'test_vinterro_domain_alias_complete.py' -v
