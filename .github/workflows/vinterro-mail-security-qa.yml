name: Vinterro Mail Security QA

on:
  pull_request:
    paths:
      - 'supabase/vinterro-mail-rpc-owner-access-hardening.sql'
      - 'tests/test_vinterro_mail_security.py'
      - '.github/workflows/vinterro-mail-security-qa.yml'
  push:
    branches: [master]
    paths:
      - 'supabase/vinterro-mail-rpc-owner-access-hardening.sql'
      - 'tests/test_vinterro_mail_security.py'
      - '.github/workflows/vinterro-mail-security-qa.yml'

permissions:
  contents: read

jobs:
  safety-grants:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Run MailAgent privilege regression
        run: python3 -m unittest discover -s tests -p 'test_vinterro_mail_security.py' -v
