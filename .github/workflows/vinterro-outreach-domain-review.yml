name: Historical Outreach Domain QA

on:
  pull_request:
    paths:
      - 'supabase/vinterro-first-touch-domain-review-20261009.sql'
      - 'tests/test_vinterro_outreach_domain_review.py'
      - '.github/workflows/vinterro-outreach-domain-review.yml'
  push:
    branches: [master]
    paths:
      - 'supabase/vinterro-first-touch-domain-review-20261009.sql'
      - 'tests/test_vinterro_outreach_domain_review.py'
      - '.github/workflows/vinterro-outreach-domain-review.yml'

permissions:
  contents: read

jobs:
  domain-review-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Verify manual review gate preserves fail-closed behavior
        run: python3 -m unittest discover -s tests -p 'test_vinterro_outreach_domain_review.py' -v
