name: Reusable Shopify Quality

on:
  workflow_call:
    inputs:
      theme_root:
        description: Theme root path
        required: false
        type: string
        default: '.'
      base_ref:
        description: Base branch/ref for changed-file annotations
        required: false
        type: string
        default: 'main'
      flags:
        description: Optional Theme Check flags
        required: false
        type: string
        default: '--fail-level error'

permissions:
  contents: read
  checks: write

jobs:
  theme-check:
    name: Shopify Theme Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Theme Check
        uses: Shopify/theme-check-action@58fd69afdfc30110f997ba9e212b302671e00d3b # v2.2.0
        with:
          theme_root: ${{ inputs.theme_root }}
          token: ${{ github.token }}
          base: ${{ inputs.base_ref }}
          flags: ${{ inputs.flags }}
