name: Vinterro Agents SDK pilot
on:
  pull_request:
    paths:
      - 'services/vinterro-agents-sdk-pilot/**'
      - '.github/workflows/vinterro-agents-sdk-pilot.yml'
permissions:
  contents: read
jobs:
  mock-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test services/vinterro-agents-sdk-pilot/pilot.test.mjs
  sdk-install:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/vinterro-agents-sdk-pilot
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node --input-type=module -e 'import { Agent, run } from "@openai/agents"; if(typeof Agent !== "function" || typeof run !== "function") process.exit(1); const reviewer = new Agent({name:"Reviewer", instructions:"Synthetic test only"}); new Agent({name:"Coordinator",handoffs:[reviewer]});'
      - uses: actions/upload-artifact@v4
        with:
          name: agents-sdk-lockfile
          path: services/vinterro-agents-sdk-pilot/package-lock.json
          if-no-files-found: error
          retention-days: 7
