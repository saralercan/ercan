name: Vinterro Agents SDK pilot
on:
  pull_request:
    paths:
      - 'services/vinterro-agents-sdk-pilot/**'
      - '.github/workflows/vinterro-agents-sdk-pilot.yml'
permissions:
  contents: read
jobs:
  mock-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test services/vinterro-agents-sdk-pilot/pilot.test.mjs
