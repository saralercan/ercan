name: Vinterro One Runtime Expertise

on:
  pull_request:
    paths:
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - 'docs/standards/VINTERRO_RUNTIME_AGENT_MANIFEST.json'
      - 'docs/standards/PORTABLE_AGENT_RUNTIME.md'
      - 'docs/standards/AGENT_CONTINUAL_EXPERTISE_ENGINE.md'
      - 'docs/standards/AGENT_EXPERTISE_SOURCE_MATRIX.json'
      - 'docs/standards/PLATFORM_EXPERT_TRAINING.md'
      - 'docs/standards/SHOPIFY_EXPERT_SOURCE_PACK.md'
      - 'docs/standards/AGENT_REGISTRY.md'
      - '.agents/skills/portable-agent-router/**'
      - '.agents/skills/finance-specialist/**'
      - '.agents/skills/ecommerce-specialist/**'
      - '.claude/agents/vinterro-router.md'
      - 'scripts/validate_runtime_expertise.py'
      - '.github/workflows/runtime-expertise.yml'
  push:
    branches: [master]
    paths:
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - 'docs/standards/**'
      - '.agents/skills/**'
      - '.claude/agents/**'
      - 'scripts/validate_runtime_expertise.py'
      - '.github/workflows/runtime-expertise.yml'

permissions:
  contents: read

jobs:
  validate-runtime-expertise:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Validate 89-agent expertise coverage
        run: python3 scripts/validate_runtime_expertise.py
