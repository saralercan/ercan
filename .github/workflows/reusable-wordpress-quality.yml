name: Reusable WordPress Quality

on:
  workflow_call:
    inputs:
      working_directory:
        description: Plugin/theme/project working directory
        required: false
        type: string
        default: '.'
      node_version:
        description: Node.js version used by project tooling
        required: false
        type: string
        default: '22'
      install_command:
        required: false
        type: string
        default: 'npm ci'
      lint_command:
        required: false
        type: string
        default: 'npm run lint --if-present'
      php_command:
        description: Optional PHPCS/PHP compatibility command
        required: false
        type: string
        default: ''
      test_command:
        required: false
        type: string
        default: 'npm test --if-present'
      e2e_command:
        description: Optional wp-env/Playwright E2E command
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  quality:
    name: WordPress lint / test / E2E
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node_version }}
          cache: npm
          cache-dependency-path: ${{ inputs.working_directory }}/package-lock.json

      - name: Install
        working-directory: ${{ inputs.working_directory }}
        run: ${{ inputs.install_command }}

      - name: Lint
        working-directory: ${{ inputs.working_directory }}
        run: ${{ inputs.lint_command }}

      - name: PHP / PHPCS / compatibility checks
        if: ${{ inputs.php_command != '' }}
        working-directory: ${{ inputs.working_directory }}
        run: ${{ inputs.php_command }}

      - name: Unit / integration tests
        working-directory: ${{ inputs.working_directory }}
        run: ${{ inputs.test_command }}

      - name: Browser E2E
        if: ${{ inputs.e2e_command != '' }}
        working-directory: ${{ inputs.working_directory }}
        run: ${{ inputs.e2e_command }}
